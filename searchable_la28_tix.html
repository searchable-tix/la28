<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LA28 Olympic Event Schedule</title>
<style>
:root {
  --sagebrush: #6EDC6E;
  --poppy: #FF8C3A;
  --bluebell: #4DB6D6;
  --scarlet-flax: #FF4FA3;
  --accent: var(--poppy);
  --link: var(--bluebell);
  --fav-star: var(--sagebrush);
  --focus-ring: var(--scarlet-flax);
  --badge-bg: var(--scarlet-flax);
  --body-bg: #0A0A0F;
  --container-bg: #12121A;
  --text: #E8E8ED;
  --muted: #6B6B7B;
  --dim: #2A2A3A;
  --selectedBg: #1A1A2E;
  --error: #FF4444;
  --sidebar-width: 260px;
  --line-height: 18px;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, 'DejaVu Sans Mono', monospace;
  font-size: 12px;
  line-height: var(--line-height);
  color: var(--text);
  background: var(--body-bg);
}

body.sidebar-resizing {
  cursor: col-resize;
  user-select: none;
}

#app {
  display: flex;
  min-height: 100vh;
}

/* Header */
#page-header {
  padding: 12px 16px 8px 16px;
  border-bottom: 1px solid var(--dim);
  flex-shrink: 0;
}

#page-header h1 {
  font-size: 14px;
  font-weight: bold;
  color: var(--poppy);
  margin-bottom: 4px;
}

#page-header .subtitle {
  font-size: 11px;
  color: var(--muted);
  margin-bottom: 8px;
}

.search-container {
  position: relative;
  display: inline-block;
}

.search-container svg {
  position: absolute;
  left: 8px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--muted);
  pointer-events: none;
}

.search-input {
  width: 30ch;
  padding: 6px 24px 6px 28px;
  font-size: 12px;
  font-family: inherit;
  background: var(--container-bg);
  color: var(--text);
  border: 1px solid var(--dim);
  border-radius: 4px;
  outline: none;
}

.search-input:focus {
  border-color: var(--focus-ring);
}

.search-input::placeholder {
  color: var(--muted);
}

.search-clear {
  position: absolute;
  right: 6px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: var(--muted);
  cursor: pointer;
  font-size: 12px;
  padding: 2px 4px;
  display: none;
  font-family: inherit;
  line-height: 1;
}

.search-clear:hover {
  color: var(--text);
}

.search-clear.visible {
  display: block;
}

.search-input:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.search-input:disabled ~ .search-icon {
  opacity: 0.35;
}

.result-count {
  font-size: 10px;
  color: var(--muted);
  margin-top: 4px;
}

/* Sidebar */
#sidebar {
  width: var(--sidebar-width);
  min-width: var(--sidebar-width);
  max-width: var(--sidebar-width);
  background: var(--container-bg);
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  border-right: 1px solid var(--dim);
  overflow-y: auto;
}

.sidebar-section {
  padding: 10px 12px;
  border-bottom: 1px solid var(--dim);
}

.sidebar-section-title {
  font-size: 10px;
  font-weight: bold;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
}

.view-tabs {
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}

.view-tab {
  padding: 4px 10px;
  font-size: 11px;
  font-family: inherit;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--dim);
  border-radius: 3px;
  cursor: pointer;
  transition: all 0.15s;
}

.view-tab:hover {
  color: var(--text);
  border-color: var(--text);
}

.view-tab.active {
  background: var(--accent);
  color: var(--body-bg);
  border-color: var(--accent);
  font-weight: bold;
}

.clear-favs-btn {
  margin-top: 8px;
  padding: 3px 8px;
  font-size: 10px;
  font-family: inherit;
  background: transparent;
  color: var(--error);
  border: 1px solid var(--error);
  border-radius: 3px;
  cursor: pointer;
  opacity: 0.7;
  transition: opacity 0.15s;
}

.clear-favs-btn:hover {
  opacity: 1;
  background: var(--error);
  color: white;
}

.column-list {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.column-item {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 11px;
  color: var(--text);
  padding: 2px 0;
}

.column-item input[type="checkbox"] {
  accent-color: var(--accent);
  cursor: pointer;
  width: 13px;
  height: 13px;
}

.column-item.disabled {
  color: var(--muted);
  pointer-events: none;
}

.column-item.disabled input {
  opacity: 0.5;
}

/* Main content */
#main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100vh;
}

#table-container {
  flex: 1;
  overflow-y: auto;
  overflow-x: auto;
}

/* Table */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: auto;
}

thead th {
  background: var(--container-bg);
  padding: 6px 10px;
  text-align: left;
  font-size: 11px;
  font-weight: bold;
  color: var(--muted);
  border-bottom: 2px solid var(--dim);
  white-space: nowrap;
  text-transform: uppercase;
  letter-spacing: 0.3px;
  position: sticky;
  top: 0;
  z-index: 10;
}

thead th.col-fav {
  width: 40px;
  text-align: center;
}

tbody td {
  padding: 5px 10px;
  border-bottom: 1px solid rgba(42, 42, 58, 0.4);
  vertical-align: top;
  font-size: 12px;
}

tbody td.cell-fav {
  text-align: center;
  vertical-align: middle;
}

/* Sport group header */
.sport-group-header td {
  padding: 8px 10px 4px 10px;
  font-weight: bold;
  font-size: 12px;
  color: var(--poppy);
  border-bottom: 1px solid var(--dim);
  background: var(--container-bg);
  cursor: pointer;
  user-select: none;
}

.sport-group-header:hover td {
  background: var(--selectedBg);
}

.sport-group-header .sport-count {
  font-weight: normal;
  color: var(--muted);
  font-size: 11px;
  margin-left: 8px;
}

.sport-toggle {
  display: inline-block;
  width: 14px;
  text-align: center;
  margin-right: 4px;
  color: var(--muted);
  font-size: 10px;
  transition: transform 0.15s;
}

.sport-toggle.collapsed {
  transform: rotate(-90deg);
}

.collapse-all-btn {
  font-family: inherit;
  font-size: 10px;
  padding: 1px 6px;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--dim);
  border-radius: 3px;
  cursor: pointer;
  margin-left: 8px;
  vertical-align: middle;
}

.collapse-all-btn:hover {
  color: var(--text);
  border-color: var(--text);
}

/* Filters */
.filter-section {
  border-bottom: 1px solid var(--dim);
}

.filter-group {
  border-bottom: 1px solid rgba(42, 42, 58, 0.4);
  }

.filter-group:last-child {
  border-bottom: none;
  }

.filter-group-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 0;
  cursor: pointer;
  user-select: none;
  font-size: 11px;
  color: var(--text);
  }

.filter-group-header:hover {
  color: var(--poppy);
  }

.filter-group-toggle {
  display: inline-block;
  width: 12px;
  text-align: center;
  color: var(--muted);
  font-size: 9px;
  transition: transform 0.15s;
  margin-right: 4px;
  }

.filter-group-toggle.collapsed {
  transform: rotate(-90deg);
  }

.filter-group-label {
  font-weight: bold;
  }

.filter-group-count {
  color: var(--muted);
  font-size: 10px;
  }

.filter-options {
  padding-bottom: 6px;
  }

.filter-option {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 2px 0 2px 16px;
  font-size: 11px;
  }

.filter-option input[type="checkbox"] {
  accent-color: var(--accent);
  cursor: pointer;
  width: 13px;
  height: 13px;
  flex-shrink: 0;
  }

.filter-option-label {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  }

.filter-only-btn {
  font-family: inherit;
  font-size: 9px;
  padding: 0 4px;
  background: transparent;
  color: var(--muted);
  border: 1px solid transparent;
  border-radius: 2px;
  cursor: pointer;
  flex-shrink: 0;
  }

.filter-only-btn:hover {
  color: var(--bluebell);
  border-color: var(--bluebell);
  }

/* Sport group left border */
.sport-group-0 { border-left: 2px solid var(--sagebrush); }
.sport-group-1 { border-left: 2px solid var(--poppy); }
.sport-group-2 { border-left: 2px solid var(--bluebell); }
.sport-group-3 { border-left: 2px solid var(--scarlet-flax); }

/* Even sport bands */
.sport-band-even td {
  background: rgba(255, 255, 255, 0.015);
}

/* Row hover */
tbody tr.event-row:hover td {
  background: var(--selectedBg);
}

/* Fav button */
.fav-btn {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 16px;
  line-height: 1;
  padding: 2px;
  transition: transform 0.15s;
  color: var(--muted);
}

.fav-btn:hover {
  transform: scale(1.2);
}

.fav-btn.favorited {
  color: var(--fav-star);
}

.fav-btn.pulse {
  animation: fav-pulse 0.25s ease-out;
}

@keyframes fav-pulse {
  0% { transform: scale(0.7); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}

/* Description cell */
.cell-desc {
  white-space: pre-line;
  line-height: 1.5;
}

/* Ticket link */
.ticket-link {
  display: inline-block;
  padding: 2px 8px;
  font-size: 10px;
  font-family: inherit;
  background: transparent;
  color: var(--link);
  border: 1px solid var(--link);
  border-radius: 3px;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}

.ticket-link:hover {
  background: var(--link);
  color: var(--body-bg);
}

.ticket-na {
  color: var(--muted);
  font-size: 11px;
}

/* Session type badge */
.session-type {
  display: inline-block;
  padding: 1px 6px;
  font-size: 10px;
  border-radius: 3px;
  font-family: inherit;
}

.session-type-final { background: var(--poppy); color: var(--body-bg); font-weight: bold; }
.session-type-semifinal { background: var(--bluebell); color: var(--body-bg); }
.session-type-quarterfinal { background: var(--scarlet-flax); color: var(--body-bg); }
.session-type-bronze { background: rgba(255, 140, 58, 0.2); color: var(--poppy); }
.session-type-preliminary { background: rgba(77, 182, 214, 0.15); color: var(--bluebell); }
.session-type-na { color: var(--muted); }

/* Hamburger */
#hamburger {
  display: none;
  position: fixed;
  top: 10px;
  left: 10px;
  z-index: 100;
  padding: 4px 8px;
  font-size: 16px;
  font-family: inherit;
  background: var(--container-bg);
  color: var(--text);
  border: 1px solid var(--dim);
  border-radius: 4px;
  cursor: pointer;
}

#hamburger:hover {
  border-color: var(--poppy);
}

.sidebar-close {
  display: none;
  padding: 3px 8px;
  font-size: 14px;
  font-family: inherit;
  background: transparent;
  color: var(--muted);
  border: 1px solid var(--dim);
  border-radius: 3px;
  cursor: pointer;
  float: right;
}

.sidebar-close:hover {
  color: var(--text);
  border-color: var(--text);
}

#sidebar-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  z-index: 98;
}

/* Footer */
.footer {
  padding: 16px;
  text-align: center;
  color: var(--dim);
  font-size: 10px;
  border-top: 1px solid var(--dim);
}

/* Mobile */
@media (max-width: 900px) {
  #sidebar {
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;
    height: 100vh;
    z-index: 99;
    transform: translateX(-100%);
    transition: transform 0.3s;
  }

  #sidebar.open {
    transform: translateX(0);
  }

  #sidebar-overlay.open {
    display: block;
  }

  #hamburger {
    display: block;
  }

  .sidebar-close {
    display: block;
  }
}

@media print {
  #sidebar { display: none !important; }
  #hamburger { display: none !important; }
  body { background: white; color: black; }
}
</style>
</head>

<button id="hamburger" title="Open sidebar">☰</button>
<div id="sidebar-overlay"></div>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-section" style="display:flex;align-items:center;justify-content:space-between;">
      <span style="font-weight:bold;font-size:12px;color:var(--poppy);">LA28</span>
      <button class="sidebar-close" id="sidebar-close" title="Close">✕</button>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">View</div>

      <div id="filter-picker"></div>
    </div>
  </aside>
  <div id="main">
    <header id="page-header">

    <div id="table-container">

      </table>
    </div>
    <div class="footer">
      LA28 Olympic Event Schedule · Data embedded directly in this page · <span id="footer-count"></span>
    </div>
  </div>

<script>
(function() {
  'use strict';

  // ============================================================
  // DATA LOADING
  // ============================================================

  const base64 = document.getElementById('event-data').textContent;
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  const events = JSON.parse(new TextDecoder('utf-8').decode(bytes));

  // ============================================================
  // CONSTANTS
  // ============================================================

  const ALL_COLUMNS = [
    { key: 'Sport', label: 'Sport', default: true },
    { key: 'Session Code', label: 'Session Code', default: true },
    { key: 'Date', label: 'Date', default: true },
    { key: 'Session Description', label: 'Description', default: true },
    { key: 'ticketLink', label: 'Tickets', default: true },
    { key: 'Venue', label: 'Venue', default: false },
    { key: 'Zone', label: 'Zone', default: false },
    { key: 'Games Day', label: 'Games Day', default: false },
    { key: 'Session Type', label: 'Session Type', default: false },
    { key: 'Start Time', label: 'Start Time', default: false },
    { key: 'End Time', label: 'End Time', default: false },
  ];

  const STORAGE_KEY = 'la28_schedule_prefs';

  // ============================================================
  // STATE
  // ============================================================

  let state = {
    favorites: new Set(),
    visibleColumns: ALL_COLUMNS.filter(c => c.default).map(c => c.key),
    sidebarOpen: true,
    activeView: 'all',
    searchQuery: '',
    collapsedSports: new Set(),
    filters: {
      'Session Type': null,
      'Zone': null,
      'Sport': null
    },
    collapsedFilters: new Set(['Session Type', 'Zone', 'Sport'])
  };

  // ============================================================
  // PERSISTENCE
  // ============================================================

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return;
      const saved = JSON.parse(raw);
      if (saved.favorites) state.favorites = new Set(saved.favorites);
      if (saved.visibleColumns) state.visibleColumns = saved.visibleColumns;
      if (typeof saved.sidebarOpen === 'boolean') state.sidebarOpen = saved.sidebarOpen;
      if (saved.activeView) state.activeView = saved.activeView;
      if (saved.collapsedSports) state.collapsedSports = new Set(saved.collapsedSports);
    } catch(e) {}
  }

  let saveTimer = null;
  function saveState() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          favorites: Array.from(state.favorites),
          visibleColumns: state.visibleColumns,
          sidebarOpen: state.sidebarOpen,
          activeView: state.activeView,
          collapsedSports: Array.from(state.collapsedSports),
          filters: state.filters,
          collapsedFilters: Array.from(state.collapsedFilters)
        }));
      } catch(e) {}
    }, 300);
  }

  // ============================================================
  // HELPERS
  // ============================================================

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text;
    return d.innerHTML;
  }

  function getSportIndex(sport) {
    const sports = [...new Set(events.map(e => e.Sport))].sort((a, b) =>
      a.toLowerCase().localeCompare(b.toLowerCase())
    );
    return sports.indexOf(sport);
  }

  const BRAND_COLORS = ['sagebrush', 'poppy', 'bluebell', 'scarlet-flax'];

  function getSportColorClass(sport) {
    return 'sport-group-' + (getSportIndex(sport) % 4);
  }

  function isEvenSportGroup(sport) {
    return getSportIndex(sport) % 2 === 1;
  }

  // Precompute sport index map for performance
  const sportIndexMap = new Map();
  const sortedSports = [...new Set(events.map(e => e.Sport))].sort((a, b) =>
    a.toLowerCase().localeCompare(b.toLowerCase())
  );
  sortedSports.forEach((s, i) => sportIndexMap.set(s, i));

  function getSportIndexFast(sport) {
    return sportIndexMap.get(sport);
  }

  function getSportColorClassFast(sport) {
    return 'sport-group-' + (sportIndexMap.get(sport) % 4);
  }

  function isEvenSportGroupFast(sport) {
    return sportIndexMap.get(sport) % 2 === 1;
  }

  // ============================================================
  // FILTERING
  // ============================================================

  function getFilteredEvents() {
    let filtered = events;

    // View filter: show all favorites (no search filtering when viewing favorites)
    if (state.activeView === 'favorites') {
      filtered = filtered.filter(e => state.favorites.has(e['Session Code']));
    }

    // Search filter (skip when viewing favorites)
    const q = state.searchQuery.trim().toLowerCase();
    if (q && state.activeView !== 'favorites') {
      const codeMatches = [];
      const sportMatches = [];
      const codeSet = new Set();

      for (const e of filtered) {
        if (e['Session Code'].toLowerCase().includes(q)) {
          codeMatches.push(e);
          codeSet.add(e['Session Code']);
        }
      }

      for (const e of filtered) {
        if (!codeSet.has(e['Session Code']) && e.Sport.toLowerCase().includes(q)) {
          sportMatches.push(e);
        }
      }

      filtered = [...codeMatches, ...sportMatches];
    }

    // Apply sidebar filters
    for (const field of FILTER_FIELDS) {
      const selected = state.filters[field];
      if (selected) {
        filtered = filtered.filter(e => selected.includes(e[field]));
      }
    }

    // Sort by sport name, then session code
    filtered.sort((a, b) => {
      const sc = a.Sport.toLowerCase().localeCompare(b.Sport.toLowerCase());
      if (sc !== 0) return sc;
      return a['Session Code'].localeCompare(b['Session Code']);
    });

    return filtered;
  }

  // ============================================================
  // FILTERS
  // ============================================================

  const FILTER_FIELDS = ['Session Type', 'Zone', 'Sport'];

  function getUniqueValues(field) {
    const vals = [...new Set(events.map(e => e[field]))].filter(v => v).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
    return vals;
  }

  // Initialize filters to all-checked if null (first load)
  function ensureFiltersInitialized() {
    for (const field of FILTER_FIELDS) {
      if (!state.filters[field]) {
        state.filters[field] = getUniqueValues(field);
      }
    }
  }

  function isFilterActive(field) {
    const selected = state.filters[field];
    const all = getUniqueValues(field);
    return selected.length < all.length;
  }

  function renderFilters() {
    const container = document.getElementById('filter-picker');
    let html = '';

    for (const field of FILTER_FIELDS) {
      const allValues = getUniqueValues(field);
      const selected = state.filters[field] || allValues;
      const isCollapsed = state.collapsedFilters.has(field);
      const active = isFilterActive(field);
      const activeCount = selected.length;

      html += '<div class="filter-group" data-filter-field="' + escapeHtml(field) + '">';
      html += '<div class="filter-group-header" data-toggle-filter="' + escapeHtml(field) + '">';
      html += '<span><span class="filter-group-toggle' + (isCollapsed ? ' collapsed' : '') + '">▼</span>';
      html += '<span class="filter-group-label">' + escapeHtml(field) + '</span></span>';
      html += '<span class="filter-group-count">' + (active ? activeCount + '/' + allValues.length : 'all') + '</span>';
      if (active) {
        html += '<button class="filter-only-btn filter-clear-btn" data-clear-filter="' + escapeHtml(field) + '">reset</button>';
      }
      html += '</div>';

      if (!isCollapsed) {
        html += '<div class="filter-options">';
        for (const val of allValues) {
          const checked = selected.includes(val);
          html += '<div class="filter-option">';
          html += '<input type="checkbox" ' + (checked ? 'checked' : '') + ' data-filter-field="' + escapeHtml(field) + '" data-filter-value="' + escapeHtml(val) + '">';
          html += '<span class="filter-option-label">' + escapeHtml(val) + '</span>';
          html += '<button class="filter-only-btn" data-filter-field="' + escapeHtml(field) + '" data-filter-value="' + escapeHtml(val) + '">only</button>';
          html += '</div>';
        }
        html += '</div>';
      }

      html += '</div>';
    }

    container.innerHTML = html;
  }

  // ============================================================
  // RENDERING
  // ============================================================

  function renderTableHead() {
    const thead = document.getElementById('table-head');
    const cols = state.visibleColumns;
    // Determine expand/collapse all label
    const visibleSports = new Set(getFilteredEvents().map(e => e.Sport));
    const allCollapsed = [...visibleSports].every(s => state.collapsedSports.has(s));
    const toggleLabel = allCollapsed ? 'Expand All' : 'Collapse All';
    let html = '<tr><th class="col-fav">★</th>';
    for (const key of cols) {
      const col = ALL_COLUMNS.find(c => c.key === key);
      if (key === 'Sport') {
        html += '<th>' + escapeHtml(col.label) +
          '<button class="collapse-all-btn" id="collapse-all-btn">' + toggleLabel + '</button></th>';
      } else {
        html += '<th>' + escapeHtml(col ? col.label : key) + '</th>';
      }
    }
    html += '</tr>';
    thead.innerHTML = html;
  }

  function renderTicketCell(link) {
    if (link) {
      return '<a class="ticket-link" href="' + escapeHtml(link) + '" target="_blank" rel="noopener noreferrer">🎫 Tickets</a>';
    }
    return '<span class="ticket-na">N/A</span>';
  }

  function renderSessionType(type) {
    if (!type || type === 'N/A') return '<span class="session-type session-type-na">—</span>';
    const cls = 'session-type-' + type.toLowerCase().replace(/[^a-z]/g, '');
    return '<span class="session-type ' + cls + '">' + escapeHtml(type) + '</span>';
  }

  function renderCell(event, key) {
    switch(key) {
      case 'ticketLink':
        return renderTicketCell(event[key]);
      case 'Session Description':
        return '<div class="cell-desc">' + escapeHtml(event[key] || '') + '</div>';
      case 'Session Type':
        return renderSessionType(event[key]);
      default:
        return escapeHtml(event[key] || '');
    }
  }

  function renderTable() {
    const tbody = document.getElementById('table-body');
    const filtered = getFilteredEvents();
    const cols = state.visibleColumns;

    // Update counts
    document.getElementById('result-count').textContent =
      'Showing ' + filtered.length + ' of ' + events.length + ' events';

    const ticketed = events.filter(e => e.ticketLink).length;
    document.getElementById('subtitle').textContent =
      events.length + ' events · ' + ticketed + ' with tickets';
    document.getElementById('footer-count').textContent =
      events.length + ' events · ' + ticketed + ' ticketed';

    if (filtered.length === 0) {
      tbody.innerHTML = '<tr><td colspan="' + (cols.length + 1) + '" style="text-align:center;padding:40px;color:var(--muted);">No events found</td></tr>';
      return;
    }

    const parts = [];
    let currentSport = null;

    // Count events per sport for group headers
    const sportCounts = new Map();
    for (const e of filtered) {
      sportCounts.set(e.Sport, (sportCounts.get(e.Sport) || 0) + 1);
    }

    for (let i = 0; i < filtered.length; i++) {
      const e = filtered[i];

      // Sport group header
      if (e.Sport !== currentSport) {
        currentSport = e.Sport;
        const isCollapsed = state.collapsedSports.has(e.Sport);
        parts.push(
          '<tr class="sport-group-header" data-sport="' + escapeHtml(e.Sport) + '">' +
            '<td class="' + getSportColorClassFast(e.Sport) + '"></td>' +
            '<td colspan="' + cols.length + '" style="color:var(--poppy);">' +
              '<span class="sport-toggle' + (isCollapsed ? ' collapsed' : '') + '">▼</span>' +
              escapeHtml(e.Sport) +
              '<span class="sport-count">(' + sportCounts.get(e.Sport) + ' events)</span>' +
            '</td>' +
          '</tr>'
        );
      }

      // Skip rendering rows for collapsed sports
      if (state.collapsedSports.has(e.Sport)) continue;

      const colorClass = getSportColorClassFast(e.Sport);
      const bandClass = isEvenSportGroupFast(e.Sport) ? ' sport-band-even' : '';
      const isFav = state.favorites.has(e['Session Code']);

      parts.push(
        '<tr class="event-row' + bandClass + '">' +
          '<td class="cell-fav ' + colorClass + '">' +
            '<button class="fav-btn' + (isFav ? ' favorited' : '') + '" ' +
              'data-code="' + escapeHtml(e['Session Code']) + '" ' +
              'aria-label="' + (isFav ? 'Remove from favorites' : 'Add to favorites') + '" ' +
              'title="' + (isFav ? 'Remove from favorites' : 'Add to favorites') + '">' +
              (isFav ? '★' : '+') +
            '</button>' +
          '</td>'
      );

      for (const key of cols) {
        const colorBorder = (key === cols[0]) ? ' ' + colorClass : '';
        parts.push('<td' + colorBorder + '>' + renderCell(e, key) + '</td>');
      }

      parts.push('</tr>');
    }

    tbody.innerHTML = parts.join('');
  }

  function renderSidebar() {
    // View tabs
    const tabs = document.querySelectorAll('.view-tab');
    tabs.forEach(tab => {
      const view = tab.dataset.view;
      tab.classList.toggle('active', view === state.activeView);
      if (view === 'favorites') {
        tab.textContent = 'Favorites (' + state.favorites.size + ')';
      } else {
        tab.textContent = 'All';
      }
    });

    // Clear all button
    const clearBtn = document.getElementById('clear-favs-btn');
    clearBtn.style.display = (state.activeView === 'favorites' && state.favorites.size > 0) ? 'inline-block' : 'none';

    // Column picker
    const picker = document.getElementById('column-picker');
    let html = '';
    for (const col of ALL_COLUMNS) {
      const checked = state.visibleColumns.includes(col.key);
      html += '<label class="column-item">' +
        '<input type="checkbox" ' + (checked ? 'checked' : '') +
        ' data-column="' + col.key + '">' +
        escapeHtml(col.label) +
      '</label>';
    }
    picker.innerHTML = html;
  }

  // ============================================================
  // EVENT HANDLERS
  // ============================================================

  // Sport group collapse/expand (delegated on tbody)
  document.getElementById('table-body').addEventListener('click', function(e) {
    const header = e.target.closest('.sport-group-header');
    if (header) {
      const sport = header.dataset.sport;
      if (state.collapsedSports.has(sport)) {
        state.collapsedSports.delete(sport);
      } else {
        state.collapsedSports.add(sport);
      }
      saveState();
      renderTableHead();
      renderTable();
      return;
    }

    // Favorites (delegated)
    const btn = e.target.closest('.fav-btn');
    if (!btn) return;

    const code = btn.dataset.code;
    if (state.favorites.has(code)) {
      state.favorites.delete(code);
    } else {
      state.favorites.add(code);
    }

    // Animate
    btn.classList.add('pulse');
    setTimeout(() => btn.classList.remove('pulse'), 250);

    saveState();
    renderTable();
    renderSidebar();
  });

  // Filters: toggle group collapse (delegated)
  document.getElementById('filter-picker').addEventListener('click', function(e) {
    // Toggle filter group header
    const header = e.target.closest('.filter-group-header');
    if (header && !e.target.closest('.filter-only-btn')) {
      const field = header.dataset.toggleFilter;
      if (state.collapsedFilters.has(field)) {
        state.collapsedFilters.delete(field);
      } else {
        state.collapsedFilters.add(field);
      }
      saveState();
      renderFilters();
      return;
    }

    // Only button
    const onlyBtn = e.target.closest('.filter-only-btn');
    if (onlyBtn && !onlyBtn.classList.contains('filter-clear-btn')) {
      const field = onlyBtn.dataset.filterField;
      const value = onlyBtn.dataset.filterValue;
      state.filters[field] = [value];
      saveState();
      renderFilters();
      renderTableHead();
      renderTable();
      return;
    }

    // Clear/reset button
    const clearBtn = e.target.closest('.filter-clear-btn');
    if (clearBtn) {
      const field = clearBtn.dataset.clearFilter;
      state.filters[field] = getUniqueValues(field);
      saveState();
      renderFilters();
      renderTableHead();
      renderTable();
      return;
    }
  });

  // Filters: checkbox changes (delegated)
  document.getElementById('filter-picker').addEventListener('change', function(e) {
    const cb = e.target;
    if (!cb.dataset.filterField) return;
    const field = cb.dataset.filterField;
    const value = cb.dataset.filterValue;

    let selected = state.filters[field];
    if (cb.checked) {
      if (!selected.includes(value)) selected.push(value);
      // Re-sort to maintain alphabetical order
      selected.sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
    } else {
      state.filters[field] = selected.filter(v => v !== value);
    }

    saveState();
    renderFilters();
    renderTableHead();
    renderTable();
  });

  // Collapse/expand all (delegated on thead)
  document.getElementById('table-head').addEventListener('click', function(e) {
    const btn = e.target.closest('#collapse-all-btn');
    if (!btn) return;
    const visibleSports = new Set(getFilteredEvents().map(ev => ev.Sport));
    const allCollapsed = [...visibleSports].every(s => state.collapsedSports.has(s));
    if (allCollapsed) {
      // Expand all
      state.collapsedSports.clear();
    } else {
      // Collapse all
      for (const s of visibleSports) state.collapsedSports.add(s);
    }
    saveState();
    renderTableHead();
    renderTable();
  });

  // View tabs
  document.querySelector('.view-tabs').addEventListener('click', function(e) {
    const tab = e.target.closest('.view-tab');
    if (!tab) return;
    state.activeView = tab.dataset.view;

    // Toggle search usability
    if (state.activeView === 'favorites') {
      searchInput.disabled = true;
    } else {
      searchInput.disabled = false;
      searchInput.focus();
    }

    saveState();
    renderTable();
    renderSidebar();
  });

  // Clear all favorites
  document.getElementById('clear-favs-btn').addEventListener('click', function() {
    state.favorites.clear();
    saveState();
    renderTable();
    renderSidebar();
  });

  // Column picker
  document.getElementById('column-picker').addEventListener('change', function(e) {
    const cb = e.target;
    const key = cb.dataset.column;
    if (!key) return;

    if (cb.checked) {
      if (!state.visibleColumns.includes(key)) {
        // Insert in ALL_COLUMNS order
        const newCols = [];
        for (const col of ALL_COLUMNS) {
          if (state.visibleColumns.includes(col.key) || col.key === key) {
            newCols.push(col.key);
          }
        }
        state.visibleColumns = newCols;
      }
    } else {
      state.visibleColumns = state.visibleColumns.filter(k => k !== key);
    }

    saveState();
    renderTableHead();
    renderTable();
  });

  // Search
  let searchTimer = null;
  const searchInput = document.getElementById('search-input');
  const searchClear = document.getElementById('search-clear');

  function updateSearchClear() {
    searchClear.classList.toggle('visible', searchInput.value.length > 0);
  }

  searchInput.addEventListener('input', function(e) {
    clearTimeout(searchTimer);
    updateSearchClear();
    searchTimer = setTimeout(() => {
      state.searchQuery = e.target.value;
      renderTable();
    }, 150);
  });

  searchClear.addEventListener('click', function() {
    searchInput.value = '';
    state.searchQuery = '';
    updateSearchClear();
    searchInput.focus();
    renderTable();
  });

  // Hamburger / sidebar toggle (mobile)
  document.getElementById('hamburger').addEventListener('click', function() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    sidebar.classList.add('open');
    overlay.classList.add('open');
    state.sidebarOpen = true;
    saveState();
  });

  function closeSidebar() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebar-overlay').classList.remove('open');
    state.sidebarOpen = false;
    saveState();
  }

  document.getElementById('sidebar-overlay').addEventListener('click', closeSidebar);
  document.getElementById('sidebar-close').addEventListener('click', closeSidebar);

  // ============================================================
  // INIT
  // ============================================================

  loadState();
  ensureFiltersInitialized();
  renderTableHead();
  renderSidebar();
  renderFilters();
  renderTable();

  // Restore sidebar open state on mobile
  if (window.innerWidth <= 900 && state.sidebarOpen) {
    document.getElementById('sidebar').classList.add('open');
  }

  // Disable search if starting in favorites view
  if (state.activeView === 'favorites') {
    searchInput.disabled = true;
  }
  updateSearchClear();

})();
</script>
</body>
</html>
